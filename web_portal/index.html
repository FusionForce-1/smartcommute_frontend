<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com/leaflet@1.9.4/ https://unpkg.com/esp-web-tools@10.2.1/ https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/ https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://unpkg.com/leaflet@1.9.4/ https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com/leaflet@1.9.4/ https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://smart-commute-backend.onrender.com wss://smart-commute-backend.onrender.com http://localhost:8000 ws://localhost:8000 https://nominatim.openstreetmap.org https://router.project-osrm.org https://accounts.google.com/gsi/ https://unpkg.com; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Smart Commute — Web Portal</title>
  <link rel="icon" type="image/png" href="assets/icons/smartcommute-favicon.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>
  <!-- The mock router (js/router.js) renders the current screen into here. -->
  <div id="app"></div>

  <!-- Constants + auth mocks — never inlined in index.html -->
  <script src="js/config.js"></script>
  <script src="js/constants/icons.js"></script>
  <script src="js/services/session.js"></script>
  <script src="js/services/apiClient.js"></script>
  <script src="js/services/googleAuth.js"></script>
  <script src="js/services/authModule.js"></script>

  <!-- Reusable builders first -->
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/legal.js"></script>
  <script src="js/operatorProfileRules.js"></script>
  <script src="js/passwordRule.js"></script>

  <!-- Each view file self-registers with Router.register(...) when loaded.
       Forgot Password + Verify OTP are a popup (js/modal.js), not routes —
       see js/views/authPopup.js, opened from login.js. -->
  <script src="js/views/login.js"></script>
  <script src="js/views/register.js"></script>
  <script src="js/views/authPopup.js"></script>

  <!-- Shared helpers + Router.start() — must load last -->
  <script src="js/main.js"></script>
</body>
</html>
