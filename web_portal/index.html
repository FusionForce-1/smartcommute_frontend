<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Commute — Web Portal</title>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/modal.css" />
</head>
<body>
  <!-- The mock router (js/router.js) renders the current screen into here. -->
  <div id="app"></div>

  <!-- Constants + Francis (Velez) auth mocks — never inlined in index.html -->
  <script src="js/constants/icons.js"></script>
  <script src="js/services/authModule.js"></script>

  <!-- Reusable builders first -->
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>
  <script src="js/modal.js"></script>

  <!-- Each view file self-registers with Router.register(...) when loaded.
       Forgot Password + Verify OTP are a popup (js/modal.js), not routes —
       see js/views/authPopup.js, opened from login.js. -->
  <script src="js/views/login.js"></script>
  <script src="js/views/register.js"></script>
  <script src="js/views/authPopup.js"></script>

  <!-- Shared helpers + Router.start() — must load last -->
  <script src="js/main.js"></script>
</body>
</html>
