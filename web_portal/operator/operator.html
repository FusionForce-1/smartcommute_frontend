<!DOCTYPE html>
<html lang="en" class="admin-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com/leaflet@1.9.4/ https://unpkg.com/esp-web-tools@10.2.1/ https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/ https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://unpkg.com/leaflet@1.9.4/ https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com/leaflet@1.9.4/ https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://smart-commute-backend.onrender.com wss://smart-commute-backend.onrender.com http://localhost:8000 ws://localhost:8000 https://nominatim.openstreetmap.org https://router.project-osrm.org https://accounts.google.com/gsi/ https://unpkg.com; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Smart Commute — Operator Portal</title>
  <link rel="icon" type="image/png" href="../assets/icons/smartcommute-favicon.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <link rel="stylesheet" href="../css/operator.css" />
</head>
<!-- Same shell as admin/admin.html (styled by admin.css); operator.css only styles the views. -->
<body class="admin-body op-body">
  <div class="admin">
    <aside class="admin-sidebar" aria-label="Operator navigation">
      <div class="admin-sidebar__brand">
        <img class="admin-sidebar__logo" src="../assets/images/smart_commute_logo_landscape.png" alt="Smart Commute" />
      </div>
      <div class="admin-sidebar__account" id="op-account" hidden>
        <p class="admin-sidebar__name" id="op-company"></p>
      </div>
      <nav class="admin-nav" id="op-nav"></nav>
      <div class="admin-nav admin-nav--footer" id="op-nav-footer"></div>
    </aside>

    <div class="admin-main">
      <header class="admin-header">
        <h1 class="admin-header__title" id="op-title">Fleet Overview</h1>
        <button type="button" class="op-btn" id="op-subscription">Subscription</button>
      </header>

      <div class="op-notice" id="op-notice" hidden></div>

      <!-- js/operator/operatorRouter.js renders the current view here -->
      <main class="admin-content" id="op-view"></main>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>

  <!-- Config + shared services -->
  <script src="../js/config.js"></script>
  <script src="../js/constants/icons.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authModule.js"></script>
  <script src="../js/services/idleTimeout.js"></script>
  <script src="../js/operatorProfileRules.js"></script>
  <script src="../js/passwordRule.js"></script>

  <!-- Shared UI helpers (escapeHtml, loadInto, toast, modal) -->
  <script src="../js/admin/adminUi.js"></script>

  <!-- Operator building blocks -->
  <script src="../js/operator/operatorApi.js"></script>
  <script src="../js/operator/operatorUi.js"></script>
  <script src="../js/operator/operatorRouter.js"></script>
  <script src="../js/operator/trackerSetup.js"></script>
  <script src="../js/operator/routePicker.js"></script>
  <script src="../js/operator/stopEditor.js"></script>
  <script src="../js/operator/driverActivity.js"></script>
  <script src="../js/operator/driverReportAlerts.js"></script>

  <!-- Each view self-registers with OperatorRouter.register(...) -->
  <script src="../js/operator/views/fleetMap.js"></script>
  <script src="../js/operator/views/playback.js"></script>
  <script src="../js/operator/views/routes.js"></script>
  <script src="../js/operator/views/vehicles.js"></script>
  <script src="../js/operator/views/drivers.js"></script>
  <script src="../js/operator/views/driverReports.js"></script>
  <script src="../js/operator/views/announcements.js"></script>
  <script src="../js/operator/views/revenueReport.js"></script>
  <script src="../js/operator/views/reports.js"></script>
  <script src="../js/operator/views/profile.js"></script>
  <script src="../js/operator/views/settings.js"></script>
  <script src="../js/operator/views/subscription.js"></script>

  <!-- Auth guard + router start — must load last -->
  <script src="../js/operator/operatorApp.js"></script>
</body>
</html>
