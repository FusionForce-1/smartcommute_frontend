<!DOCTYPE html>
<html lang="en" class="admin-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Commute Admin</title>
  <link rel="icon" type="image/png" href="../assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin">
    <aside class="admin-sidebar" aria-label="Admin navigation">
      <div class="admin-sidebar__brand">
        <img class="admin-sidebar__logo" src="../assets/images/smart_commute_logo_landscape.png" alt="Smart Commute" />
      </div>
      <div class="admin-sidebar__account" id="admin-account" hidden>
        <p class="admin-sidebar__name" id="admin-name"></p>
      </div>
      <nav class="admin-nav" id="admin-nav"></nav>
      <div class="admin-nav admin-nav--footer" id="admin-nav-footer"></div>
    </aside>

    <div class="admin-main">
      <header class="admin-header">
        <h1 class="admin-header__title">System Administration</h1>
        <span class="admin-header__email" id="admin-email"></span>
      </header>

      <!-- js/admin/adminRouter.js renders the current view here -->
      <main class="admin-content" id="admin-view"></main>
    </div>
  </div>

  <!-- Config + shared services -->
  <script src="../js/config.js"></script>
  <script src="../js/constants/icons.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/services/session.js"></script>
  <script src="../js/services/apiClient.js"></script>
  <script src="../js/services/authModule.js"></script>

  <!-- Admin building blocks -->
  <script src="../js/admin/adminApi.js"></script>
  <script src="../js/admin/adminUi.js"></script>
  <script src="../js/admin/adminActions.js"></script>
  <script src="../js/admin/adminRouter.js"></script>

  <!-- Each view self-registers with AdminRouter.register(...) -->
  <script src="../js/admin/views/dashboard.js"></script>
  <script src="../js/admin/views/users.js"></script>
  <script src="../js/admin/views/verification.js"></script>
  <script src="../js/admin/views/systemHealth.js"></script>
  <script src="../js/admin/views/reports.js"></script>
  <script src="../js/admin/views/config.js"></script>

  <!-- Auth guard + Router start — must load last -->
  <script src="../js/admin/adminApp.js"></script>
</body>
</html>
