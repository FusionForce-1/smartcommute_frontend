name: smartcommute_app
description: "Smart Commute — Integrated Public Transport Information System (Flutter client)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^11.0.0
  flutter_dotenv: ^6.0.1
  cupertino_icons: ^1.0.6
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  flutter_svg: ^2.0.17
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  web_socket_channel: ^3.0.3
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/smart_commute_logo.png
    - assets/images/smart_commute_logo_landscape.png
    - assets/icons/google_logo.svg
    - assets/icons/current_location_marker.png
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
